{{- /* SCCs apply per pod, so this keeps the sidecars' extra capabilities to the real NSM sidecars. */ -}}
{{- if and .Values.global.profile.openshift (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- $nscImage := printf "%s/%s:%s" (include "admission-webhook.imageRegistry" .) .Values.nsmInjectContainerImageRegistry .Values.nsmInjectContainerImageTag }}
{{- $nscInitImage := printf "%s/%s:%s" (include "admission-webhook.imageRegistry" .) .Values.nsmInjectInitContainerImageRegistry .Values.nsmInjectInitContainerImageTag }}
{{- $privileged := "has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged" }}
{{- $extraCaps := "has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add.exists(x, x != 'NET_BIND_SERVICE')" }}
{{- $sidecar := printf "((c.name == '%s' && c.image == '%s') || (c.name == '%s' && c.image == '%s')) && !has(c.command) && !has(c.args)" (base .Values.nsmInjectContainerImageRegistry) $nscImage (base .Values.nsmInjectInitContainerImageRegistry) $nscInitImage }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubeslice-nsm-sidecar-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubeslice.io/slice
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: >-
        request.subResource == 'ephemeralcontainers' ||
        object.spec.containers.all(c, !({{ $privileged }}) && (!({{ $extraCaps }}) || ({{ $sidecar }})))
      message: In a slice namespace, containers may not run privileged, and only the NSM sidecars may add capabilities other than NET_BIND_SERVICE.
    - expression: >-
        request.subResource == 'ephemeralcontainers' || !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c, !({{ $privileged }}) && (!({{ $extraCaps }}) || ({{ $sidecar }})))
      message: In a slice namespace, init containers may not run privileged, and only the NSM sidecars may add capabilities other than NET_BIND_SERVICE.
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c, !({{ $privileged }}) && !({{ $extraCaps }}))
      message: In a slice namespace, ephemeral containers may not run privileged or add capabilities other than NET_BIND_SERVICE.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubeslice-nsm-sidecar-policy
spec:
  policyName: kubeslice-nsm-sidecar-policy
  validationActions: ["Deny"]
{{- end }}
