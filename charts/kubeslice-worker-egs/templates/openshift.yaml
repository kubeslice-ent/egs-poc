{{ if .Values.global.profile.openshift}}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ .Release.Name }}-anyuid-scc"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:spire
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:kubeslice-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ .Release.Name }}-privileged-scc"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:spire
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:kubeslice-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
---
# SCC for pods in slice app namespaces; the worker operator binds it per namespace.
# No privileged: NSM sidecars run as root with named capabilities (NSM_SIDECAR_RESTRICTED on the webhook).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: kubeslice-app
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostNetwork: false
allowHostPID: false
allowHostIPC: false
allowHostPorts: false
allowHostDirVolumePlugin: false
readOnlyRootFilesystem: false
# Must cover the webhook's sidecarCapabilities (nsm admission-webhook values).
allowedCapabilities:
  - NET_RAW
  - NET_BIND_SERVICE
defaultAddCapabilities: null
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret
users: []
groups: []
priority: null
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeslice-app-scc
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - kubeslice-app
    verbs:
      - use

{{end}}