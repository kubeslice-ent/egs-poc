{{- if .Values.ui.serviceAccount.create }}
# The UI never calls the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smart-scaler-app.uiServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-ui
automountServiceAccountToken: false
{{- end }}
