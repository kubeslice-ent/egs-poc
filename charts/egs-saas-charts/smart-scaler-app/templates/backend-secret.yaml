{{- if not .Values.backend.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smart-scaler-app.backendSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MYSQL_USERNAME: {{ required "backend.mysql.username is required" .Values.backend.mysql.username | quote }}
  MYSQL_PASSWORD: {{ required "backend.mysql.password is required" .Values.backend.mysql.password | quote }}
  MYSQL_HOSTNAME: {{ required "backend.mysql.hostname is required" .Values.backend.mysql.hostname | quote }}
  MYSQL_PORT: {{ .Values.backend.mysql.port | toString | quote }}
  MYSQL_DBNAME: {{ required "backend.mysql.dbname is required" .Values.backend.mysql.dbname | quote }}
  ACCESS_TOKEN_SECRET: {{ required "backend.secrets.accessTokenSecret is required" .Values.backend.secrets.accessTokenSecret | quote }}
  REFRESH_TOKEN_SECRET: {{ required "backend.secrets.refreshTokenSecret is required" .Values.backend.secrets.refreshTokenSecret | quote }}
  ENCRYPTION_SECRET: {{ required "backend.secrets.encryptionSecret is required (must be exactly 32 characters)" .Values.backend.secrets.encryptionSecret | quote }}
{{- if ne (len .Values.backend.secrets.encryptionSecret) 32 }}
{{- fail (printf "backend.secrets.encryptionSecret must be exactly 32 characters (AES-256 key), got %d" (len .Values.backend.secrets.encryptionSecret)) }}
{{- end }}
{{- end }}
