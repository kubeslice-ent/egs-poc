# Static content, copied from the real prod config:
# smart-scaler-saas-argocd/saas-registration/backend/backend-gateway-role-config.yaml
#
# This is fixed product RBAC config (role -> permission mapping), not something that
# should vary per deployment, so it's baked in here rather than exposed via values.yaml.
# internal/api/server.go calls GetRolesFromConfig() before Start() returns and Fatals on
# error - this ConfigMap is a hard boot dependency, not optional.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend-role-config
  namespace: {{ .Release.Namespace }}
data:
  role-config.yaml: |
    - display_name: Admin
      slug: admin
      description: Has complete control of all the components.
      permissions:
        - resource: dashboard
          actions:
            - read
        - resource: agents
          actions:
            - read
            - create
            - update
            - delete
            - install
        - resource: users
          actions:
            - read
            - create
            - update
            - delete
        - resource: settings
          actions:
            - read
            - update
        - resource: events
          actions:
            - read
            - create
