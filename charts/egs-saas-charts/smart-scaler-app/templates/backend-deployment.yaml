{{- include "smart-scaler-app.validateMySQL" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      # Uses the namespace's default ServiceAccount: egs-admin-rbac.yaml's RoleBinding
      # grants exactly that account read access to egs-admin-details. Change both together.
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $migration := (.Values.dbMigration | default dict) }}
      {{- if or (include "smart-scaler-app.mysqlEnabled" .) $migration.enabled }}
      initContainers:
        {{- if include "smart-scaler-app.mysqlEnabled" . }}
        # Waits for the in-cluster MySQL to accept connections (its first start initializes
        # the data directory first). mysqladmin ping succeeds even without credentials.
        - name: wait-for-mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              until mysqladmin ping --connect-timeout=5 -h "$MYSQL_HOSTNAME" -P "$MYSQL_PORT" --silent; do
                echo "waiting for MySQL at $MYSQL_HOSTNAME:$MYSQL_PORT"; sleep 3
              done
          env:
            - name: MYSQL_HOSTNAME
              value: {{ include "smart-scaler-app.mysqlHost" . | quote }}
            - name: MYSQL_PORT
              value: "3306"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
        {{- end }}
        {{- if $migration.enabled }}
        # Creates/updates the tables (see dbMigration in values.yaml). Exits non-zero on any
        # error, and the backend container does not start until it succeeds.
        - name: db-migration
          image: "{{ $migration.image.repository }}:{{ $migration.image.tag }}"
          imagePullPolicy: {{ $migration.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "smart-scaler-app.mysqlEnv" . | nindent 12 }}
            # Not used by the migration itself, but the shared smart-scaler/apis package it
            # imports panics at startup unless this is a 32-byte key.
            - name: ENCRYPTION_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "smart-scaler-app.backendSecretName" . }}, key: ENCRYPTION_SECRET } }
          {{- with $migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: GIN_MODE
              value: {{ .Values.backend.ginMode | default "debug" | quote }}
            - name: APP_ENV
              value: {{ .Values.backend.appEnv | default "development" | quote }}
            - name: CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # kubeslice-api-gw from the already-deployed egs-controller/egs-ui release.
            - name: EGS_BACKEND_URL
              value: "http://kubeslice-api-gw.{{ .Values.egs.namespace }}.svc.cluster.local:8080"
            {{- include "smart-scaler-app.mysqlEnv" . | nindent 12 }}
            - name: ACCESS_TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "smart-scaler-app.backendSecretName" . }}, key: ACCESS_TOKEN_SECRET } }
            - name: REFRESH_TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "smart-scaler-app.backendSecretName" . }}, key: REFRESH_TOKEN_SECRET } }
            - name: ENCRYPTION_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "smart-scaler-app.backendSecretName" . }}, key: ENCRYPTION_SECRET } }
            # Derived from ui.externalURL/backend.externalURL - not stored in the Secret,
            # since these are plain URLs rather than credentials. Left as empty-tolerant
            # rather than `required`: on a NodePort install the port doesn't exist until the
            # first install - see NOTES.txt. With route.enabled they come from route.host.
            {{- $uiURL := include "smart-scaler-app.uiExternalURL" . }}
            - name: UI_URL
              value: {{ $uiURL | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ $uiURL | quote }}
            - name: GATEWAY_URL
              value: {{ $uiURL | quote }}
            - name: COOKIE_DOMAIN
              value: {{ (urlParse $uiURL).hostname | quote }}
            - name: ADMIN_EMAIL_ID
              value: {{ .Values.backend.adminEmailId | quote }}
            - name: BACKEND_GATEWAY_ROLE_CONFIG_PATH
              value: "/config/"
            - name: SKIP_EMAIL_VERIFICATION
              value: {{ .Values.backend.skipEmailVerification | quote }}
            - name: DOMAIN_EXCLUSION_LIST
              value: {{ .Values.backend.domainExclusionList | quote }}
          volumeMounts:
            - name: role-config
              mountPath: /config
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: role-config
          configMap:
            name: {{ .Release.Name }}-backend-role-config
