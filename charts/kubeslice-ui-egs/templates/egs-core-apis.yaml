{{- if $.Values.kubeslice.egsCoreApis.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egs-core-apis
  namespace: {{ .Release.Namespace }}
  {{- if .Values.kubeslice.egsCoreApis.cloudSqlProxy.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.kubeslice.egsCoreApis.cloudSqlProxy.gcpServiceAccount | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: egs-core-apis
rules:
  - apiGroups: [ "" ]
    resources: [ "serviceaccounts/token" ]
    verbs: [ "create" ]
  - apiGroups: [ "" ]
    resources: [ "serviceaccounts" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    verbs: [ "get", "list" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: egs-core-apis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: egs-core-apis
subjects:
  - kind: ServiceAccount
    name: egs-core-apis
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egs-core-apis
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "get" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egs-core-apis
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egs-core-apis
subjects:
  - kind: ServiceAccount
    name: egs-core-apis
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- if .Values.kubeslice.egsCoreApis.labels }}
  labels:
  {{ toYaml .Values.kubeslice.egsCoreApis.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.kubeslice.egsCoreApis.annotations }}
  annotations:
  {{ toYaml .Values.kubeslice.egsCoreApis.annotations | nindent 4 }}
  {{- end }}
  name: egs-core-apis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
    {{- if .Values.kubeslice.egsCoreApis.labels }}
    {{ toYaml .Values.kubeslice.egsCoreApis.labels | nindent 6 }}
    {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.kubeslice.egsCoreApis.annotations }}
        {{ toYaml .Values.kubeslice.egsCoreApis.annotations | nindent 8 }}
        {{- end }}
      {{- if .Values.kubeslice.egsCoreApis.labels }}
      labels:
      {{ toYaml .Values.kubeslice.egsCoreApis.labels | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.kubeslice.egsCoreApis.tolerations }}
      tolerations: {{ toYaml .Values.kubeslice.egsCoreApis.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.kubeslice.egsCoreApis.affinity }}
      affinity:
      {{ toYaml .Values.kubeslice.egsCoreApis.affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.kubeslice.egsCoreApis.cloudSqlProxy }}
      {{- if .enabled }}
      # Native sidecar: Kubernetes starts it before the app container and keeps it running for
      # the pod's lifetime. The app reaches Postgres over loopback, so the credentials and query
      # traffic never leave the pod unencrypted, and the proxy does TLS out to Cloud SQL.
      initContainers:
        - name: cloud-sql-proxy
          image: {{ .image }}
          restartPolicy: Always
          args:
            - --private-ip
            - --port={{ .port | default 5432 }}
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - --structured-logs
            - {{ .instanceConnectionName | quote }}
          startupProbe:
            httpGet:
              path: /startup
              port: 9801
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      {{- end }}
      {{- end }}
      containers:
        - name: egs-core-apis
          securityContext:
          {{- if .Values.kubeslice.egsCoreApis.containerSecurityContext }}
          {{ toYaml .Values.kubeslice.egsCoreApis.containerSecurityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.kubeslice.egsCoreApis.resources }}
          resources: {{ toYaml .Values.kubeslice.egsCoreApis.resources | nindent 12 }}
          {{- end }}
          env:
            - name: EGS_CORE_APIS_API_KEY_SECRET_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EGS_CORE_APIS_PORT
              value: "8080"
            - name: EGS_CORE_APIS_ENABLE_EXTERNAL_TOKEN
              value: "true"
            - name: EGS_CORE_APIS_EGS_API_GATEWAY_ENDPOINT
              value: "http://kubeslice-api-gw:8080/"
            - name: DATABASE_ADDR
              {{- if .Values.kubeslice.egsCoreApis.cloudSqlProxy.enabled }}
              value: "127.0.0.1"
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kubeslice.egsCoreApis.database.secretName }}
                  key: postgresAddr
              {{- end }}
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kubeslice.egsCoreApis.database.secretName }}
                  key: postgresPort
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kubeslice.egsCoreApis.database.secretName }}
                  key: postgresDB
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kubeslice.egsCoreApis.database.secretName }}
                  key: postgresUser
            - name: DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kubeslice.egsCoreApis.database.secretName }}
                  key: postgresPassword
            # The binary ignores this: it builds its DSN with a hardcoded sslmode=disable and
            # contains no reference to DATABASE_SSL_MODE. Kept for when that is fixed upstream.
            # Encryption in transit comes from the cloud-sql-proxy sidecar instead.
            - name: DATABASE_SSL_MODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kubeslice.egsCoreApis.database.secretName }}
                  key: postgresSslmode
            - name: EGS_IDLE_TIMEOUT_DURATION
              value: "60m"
            - name: EGS_ENFORCE_IDLE_TIMEOUT
              value: "true"
            - name: DYNAMIC_GPU_NODE
              value: "false"
            - name: INFERENCE_MODEL_TOKEN
              value: {{ .Values.kubeslice.egsCoreApis.inferenceModelToken | default "" | quote }}
          ports:
            - containerPort: 8080
          image: {{ include "component.image" (dict "component" .Values.kubeslice.egsCoreApis "global" .Values.global "context" .) }}
          imagePullPolicy: {{ include "component.imagePullPolicy" (dict "component" .Values.kubeslice.egsCoreApis "global" .Values.global "context" .) }}
      restartPolicy: Always
      {{- if include "global.imagePullSecretsWithFallback" . }}
      imagePullSecrets:
{{ include "global.imagePullSecretsWithFallback" . | indent 8 }}
      {{- end }}
      serviceAccountName: egs-core-apis
      securityContext:
      {{- if .Values.kubeslice.egsCoreApis.podSecurityContext }}
      {{ toYaml .Values.kubeslice.egsCoreApis.podSecurityContext | nindent 8 }}
      {{- end }}
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.kubeslice.egsCoreApis.labels }}
  labels:
  {{ toYaml .Values.kubeslice.egsCoreApis.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.kubeslice.egsCoreApis.annotations }}
  annotations:
  {{ toYaml .Values.kubeslice.egsCoreApis.annotations | nindent 4 }}
  {{- end }}
  name: egs-core-apis
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080
  selector:
    {{- if .Values.kubeslice.egsCoreApis.labels }}
    {{ toYaml .Values.kubeslice.egsCoreApis.labels | nindent 4 }}
    {{- end }}
  type: {{ .Values.kubeslice.egsCoreApis.service.type }}
{{- end }}
